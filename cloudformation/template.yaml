AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Root CloudFormation template for the Receipt Processing System using Amazon Textract. Creates:
   - S3 bucket with versioning enabled, public access blocked, and optional KMS encryption
   - SQS queue that triggers the Lambda function
   - CloudWatch Logs log group for the Lambda function
   - IAM execution role and policies for the Lambda function
   - Lambda function

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Nested Stack Configuration"
        Parameters:
          - NestedStacksS3BucketName
      - Label:
          default: "S3 Bucket Configuration"
        Parameters:
          - ProjectName
          - BucketBaseName
          - Environment
      - Label:
          default: "Encryption Configuration"
        Parameters:
          - KmsKey
          - KmsKeyArn
      - Label:
          default: "Lambda Configuration"
        Parameters:
          - LambdaBaseName
          - LambdaRoleBaseName
      - Label:
          default: "SQS Queue Configuration"
        Parameters:
          - SQSQueueBaseName
          - SQSHighPriorityQueueBaseName
          - SQSNormalQueueBaseName
          - SQSVisibilityTimeout
      - Label:
          default: "Frontend Website Configuration"
        Parameters:
          - FrontendBucketBaseName
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
    ParameterLabels:
      NestedStacksS3BucketName:
        default: "S3 Bucket Name"
      ProjectName:
        default: "Project Name"
      BucketBaseName:
        default: "Bucket Base Name"
      Environment:
        default: "Environment"
      KmsKey:
        default: "KMS Key (ARN / Alias)"
      KmsKeyArn:
        default: "KMS Key ARN"
      CiSuffix:
        default: "CI Suffix"
      LambdaBaseName:
        default: "Lambda Base Name"
      LambdaRoleBaseName:
        default: "Lambda Execution Role Base Name"
      SQSQueueBaseName:
        default: "SQS Queue Base Name"
      SQSHighPriorityQueueBaseName:
        default: "SQS High Priority Queue Base Name"
      SQSNormalQueueBaseName:
        default: "SQS Normal Queue Base Name"
      SQSVisibilityTimeout:
        default: "SQS Visibility Timeout (seconds)"
      FrontendBucketBaseName:
        default: "Frontend Bucket Base Name"

Parameters:
  NestedStacksS3BucketName:
    Type: String
    Default: "subhamay-cfn-templates-bucket-270453428528-us-east-1"
    Description: "S3 bucket name where the nested CloudFormation template is stored"
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "S3 bucket name must be 3-63 characters, start and end with lowercase letter or number, and can contain hyphens and dots"

  ProjectName:
    Type: String
    Default: "ztc-proj"
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  BucketBaseName:
    Type: String
    Default: "sentiment-inbox"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9.-]+$"
    ConstraintDescription: "Bucket base name must be 1-20 characters and can only contain lowercase letters, numbers, hyphens, and dots"
    Description: Base name for the S3 bucket (account ID, environment, and region will be appended)

  FrontendBucketBaseName:
    Type: String
    Default: "sentiment-frontend"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9.-]+$"
    ConstraintDescription: "Frontend bucket base name must be 1-20 characters and can only contain lowercase letters, numbers, hyphens, and dots"
    Description: "Base name for the frontend website S3 bucket (account ID, environment, and region will be appended)"

  KmsKey:
    Type: String
    Default: "SB-KMS"
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "KMS Key can be a key name (e.g., my-key, auto-converted to alias/my-key), a KMS key alias (e.g., alias/my-key), or a full KMS key ARN (e.g., arn:aws:kms:region:account:key/key-id), or leave empty for no KMS encryption"
    Description: "Optional KMS Key for S3 bucket encryption. Accepts: key name (my-key), alias (alias/my-key), or ARN (arn:aws:kms:region:account:key/key-id). Plain key names are auto-converted to aliases."

  KmsKeyArn:
    Type: String
    Default: "arn:aws:kms:us-east-1:269235677084:key/e691f177-0403-4b15-b9a7-50b57b204140"
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "CloudWatch Logs KMS Key can be a key name (auto-converted to alias/<name>), a KMS key alias (alias/my-key), a full KMS key ARN, or left empty for no KMS encryption"
    Description: "Optional KMS key for encrypting the Lambda CloudWatch Logs log group. Leave empty for no KMS encryption."

  Environment:
    Type: String
    Default: devl
    AllowedValues: 
      - devl
      - test
      - prod
    Description: "Deployment environment for the S3 bucket"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the bucket name"

  LambdaBaseName:
    Type: String
    Default: "sentiment-router"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: "Lambda base name must be 1-40 characters and can only contain letters, numbers, hyphens, and underscores"
    Description: "Base name for the Lambda function and its log group (project, environment, and region will be prefixed/appended)"

  LambdaRoleBaseName:
    Type: String
    Default: "sentiment-router-lambda"
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: "Lambda execution role base name must be 1-64 characters and can only contain letters, numbers, hyphens, and underscores"
    Description: "Base name for the Lambda execution IAM role"

  SQSQueueBaseName:
    Type: String
    Default: "sentiment-router-queue"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: "SQS queue base name must be 1-40 characters and can only contain letters, numbers, hyphens, and underscores"
    Description: "Base name for the SQS queue that triggers the Lambda function (environment and region are appended)"

  SQSHighPriorityQueueBaseName:
    Type: String
    Default: "high-priority-sqs"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: "SQS high priority queue base name must be 1-40 characters and can only contain letters, numbers, hyphens, and underscores"
    Description: "Base name for the high priority SQS queue (environment and region are appended)"

  SQSNormalQueueBaseName:
    Type: String
    Default: "normal-sqs"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: "SQS normal queue base name must be 1-40 characters and can only contain letters, numbers, hyphens, and underscores"
    Description: "Base name for the normal priority SQS queue (environment and region are appended)"

  SQSVisibilityTimeout:
    Type: Number
    Default: 120
    MinValue: 0
    MaxValue: 43200
    Description: "Visibility timeout in seconds for the SQS queue. Must be at least the Lambda timeout (60s) so messages are not redelivered while being processed."

Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  HasCWLogGroupKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasKmsKey: !Not [!Equals [!Ref KmsKey, ""]]

Resources:
  LambdaTriggerQueue:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested SQS queue CloudFormation template to create the queue that triggers the Lambda function"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create SQS queues and queue policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-sqs-queue/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        QueueBaseName: !Ref SQSQueueBaseName
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
        QueueType: "Standard"
        KmsKey: !If [HasKmsKey, !Sub "alias/${KmsKey}", ""]
        VisibilityTimeout: !Ref SQSVisibilityTimeout
        S3BucketArn: 
          !If
            - HasCiSuffix
            - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
            - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: LambdaTriggerQueue
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  SQSHighPriorityQueue:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested SQS queue CloudFormation template to create the high priority queue"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create SQS queues and queue policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-sqs-queue/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        QueueBaseName: !Ref SQSHighPriorityQueueBaseName
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
        QueueType: "Standard"
        KmsKey: !If [HasKmsKey, !Sub "alias/${KmsKey}", ""]
        VisibilityTimeout: !Ref SQSVisibilityTimeout
        S3BucketArn:
          !If
            - HasCiSuffix
            - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
            - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: SQSHighPriorityQueue
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  SQSNormalQueue:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested SQS queue CloudFormation template to create the normal priority queue"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create SQS queues and queue policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-sqs-queue/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        QueueBaseName: !Ref SQSNormalQueueBaseName
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
        QueueType: "Standard"
        KmsKey: !If [HasKmsKey, !Sub "alias/${KmsKey}", ""]
        VisibilityTimeout: !Ref SQSVisibilityTimeout
        S3BucketArn:
          !If
            - HasCiSuffix
            - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
            - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${BucketBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: SQSNormalQueue
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  SentimentAnalysisBucket:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested S3 bucket CloudFormation template to create a versioned, encrypted S3 bucket with public access blocking and optional logging/website configuration"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to assume the required IAM role for S3 and KMS operations"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-s3-bucket/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        BucketBaseName: !Ref BucketBaseName
        KmsKey: !Ref KmsKey
        EnableBucketKey: "true"
        Environment: !Ref Environment
        WebsiteConfiguration: "false"
        EnableVersioning: "false"
        CiSuffix: !Ref CiSuffix
        QueueArn: !GetAtt LambdaTriggerQueue.Outputs.QueueArn
        QueueEvent: "s3:ObjectCreated:*"
        QueueFilterPrefix: "inbound/"
        QueueFilterSuffix: ".pdf"
        QueueArn2: !GetAtt LambdaTriggerQueue.Outputs.QueueArn
        QueueEvent2: "s3:ObjectCreated:*"
        QueueFilterPrefix2: "inbound/"
        QueueFilterSuffix2: ".jpg"
        QueueArn3: !GetAtt LambdaTriggerQueue.Outputs.QueueArn
        QueueEvent3: "s3:ObjectCreated:*"
        QueueFilterPrefix3: "inbound/"
        QueueFilterSuffix3: ".jpeg"
        QueueArn4: !GetAtt LambdaTriggerQueue.Outputs.QueueArn
        QueueEvent4: "s3:ObjectCreated:*"
        QueueFilterPrefix4: "inbound/"
        QueueFilterSuffix4: ".png"
      Tags:
        - Key: ManagedBy
          Value: RootStack
        - Key: NestedStackPurpose
          Value: S3BucketCreation

  FrontendBucket:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested S3 bucket CloudFormation template to create a versioned, encrypted S3 bucket configured for static website hosting of the frontend"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to assume the required IAM role for S3 and KMS operations"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-s3-bucket/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        BucketBaseName: !Ref FrontendBucketBaseName
        KmsKey: !Ref KmsKey
        EnableBucketKey: "true"
        Environment: !Ref Environment
        WebsiteConfiguration: "true"
        EnableVersioning: "true"
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: ManagedBy
          Value: RootStack
        - Key: NestedStackPurpose
          Value: FrontendWebsiteBucket
      TimeoutInMinutes: 10

  LambdaCWLogGroup:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create a log group for Lambda functions"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create CloudWatch Logs resources"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-cloudwatch-log-group/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        CustomLogGroupName: !If
          - HasCiSuffix
          - !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
        KmsKeyIdOrAlias: !If [HasCWLogGroupKmsKey, !Ref KmsKeyArn, ""]
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: LambdaLogGroup
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  LambdaIAMRole:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested IAM role CloudFormation template to create an execution role for Lambda functions with permissions for S3, SQS, Textract, and CloudWatch Logs"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create IAM roles and inline policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-iam-roles-policies/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        RoleName: !Ref LambdaRoleBaseName
        Environment: !Ref Environment
        AssumeRolePrincipal: "lambda.amazonaws.com"
        EnableLambdaBasicExecutionPolicy: "true"
        EnableKMSPolicy: "true"
        KMSKeyArn: !Ref KmsKeyArn
        EnableSQSPolicy: "true"
        EnableTextractPolicy: "true"
        EnableS3ReadOnlyPolicy: "true"
        S3BucketArn: !GetAtt SentimentAnalysisBucket.Outputs.S3BucketArn
        SQSQueueArn: !GetAtt LambdaTriggerQueue.Outputs.QueueArn
        LambdaBasicExecutionLogGroupArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}:*"
        CiSuffix: !Ref CiSuffix

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: LambdaExecutionRole
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  SentimentAnalysisLambda:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - LambdaCWLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested Lambda function CloudFormation template to create the receipt processor function using the IAM execution role and log group created by the other nested stacks"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create Lambda functions"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-lambda-function/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        LambdaFunctionBaseName: !Ref LambdaBaseName
        LambdaFunctionDescription: "Receipt processor Lambda function to extract and process receipt data"
        Environment: !Ref Environment
        Runtime: "python3.12"
        Handler: "lambda_function.handler"
        MemorySize: "256"
        Timeout: "60"
        IAMRoleArn: !GetAtt LambdaIAMRole.Outputs.RoleArn
        LambdaLogGroup: !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}"
        CiSuffix: !Ref CiSuffix
        CreateSqsQueue: "false"
        SqsQueueArn: !GetAtt LambdaTriggerQueue.Outputs.QueueArn
        SqsBatchSize: "10"
        EnvironmentNameValue: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: SentimentAnalysisLambda
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

Outputs:
  NestedStackId:
    Description: "ID of the nested stack"
    Value: !Ref SentimentAnalysisBucket

  S3BucketName:
    Description: "Name of the S3 bucket created by the nested stack"
    Value: !GetAtt SentimentAnalysisBucket.Outputs.S3BucketName

  S3BucketArn:
    Description: "ARN of the S3 bucket created by the nested stack"
    Value: !GetAtt SentimentAnalysisBucket.Outputs.S3BucketArn

  NestedStackOutputs:
    Description: "All outputs from the nested stack"
    Value: !Sub |
      BucketName: ${SentimentAnalysisBucket.Outputs.S3BucketName}
      BucketArn: ${SentimentAnalysisBucket.Outputs.S3BucketArn}

  FrontendBucketStackId:
    Description: "ID of the nested stack that creates the frontend website S3 bucket"
    Value: !Ref FrontendBucket

  FrontendBucketName:
    Description: "Name of the frontend website S3 bucket"
    Value: !GetAtt FrontendBucket.Outputs.S3BucketName

  FrontendBucketArn:
    Description: "ARN of the frontend website S3 bucket"
    Value: !GetAtt FrontendBucket.Outputs.S3BucketArn

  LambdaLogGroupStackId:
    Description: "ID of the nested stack that creates the Lambda CloudWatch Logs log group"
    Value: !Ref LambdaCWLogGroup

  LambdaLogGroupName:
    Description: "Name of the Lambda CloudWatch Logs log group"
    Value: !If
      - HasCiSuffix
      - !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
      - !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}"

  LambdaRoleArn:
    Description: "ARN of the Lambda execution IAM role created by the nested stack"
    Value: !GetAtt LambdaIAMRole.Outputs.RoleArn

  LambdaFunctionStackId:
    Description: "ID of the nested stack that creates the Lambda function"
    Value: !Ref SentimentAnalysisLambda

  SQSQueueStackId:
    Description: "ID of the nested stack that creates the SQS queue"
    Value: !Ref LambdaTriggerQueue

  SQSQueueUrl:
    Description: "URL of the SQS queue"
    Value: !GetAtt LambdaTriggerQueue.Outputs.QueueUrl

  SQSQueueArn:
    Description: "ARN of the SQS queue"
    Value: !GetAtt LambdaTriggerQueue.Outputs.QueueArn

  SQSHighPriorityQueueStackId:
    Description: "ID of the nested stack that creates the high priority SQS queue"
    Value: !Ref SQSHighPriorityQueue

  SQSHighPriorityQueueUrl:
    Description: "URL of the high priority SQS queue"
    Value: !GetAtt SQSHighPriorityQueue.Outputs.QueueUrl

  SQSHighPriorityQueueArn:
    Description: "ARN of the high priority SQS queue"
    Value: !GetAtt SQSHighPriorityQueue.Outputs.QueueArn

  SQSNormalQueueStackId:
    Description: "ID of the nested stack that creates the normal SQS queue"
    Value: !Ref SQSNormalQueue

  SQSNormalQueueUrl:
    Description: "URL of the normal SQS queue"
    Value: !GetAtt SQSNormalQueue.Outputs.QueueUrl

  SQSNormalQueueArn:
    Description: "ARN of the normal SQS queue"
    Value: !GetAtt SQSNormalQueue.Outputs.QueueArn